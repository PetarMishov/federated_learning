[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
sqlx = { version = "0.8.6", features=["runtime-tokio", "postgres"] }
argon2 = { version = "0.5.3", features = ["std"] }
dotenvy = "0.15.7"
